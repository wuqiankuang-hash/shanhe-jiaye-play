<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="在青岚村从帮工学艺起步，种田、养鱼、经营面摊，一点点置下自己的家业。手机点开即玩的古风模拟经营测试版。">
  <title>山河家业 · 青岚经营记</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="game-shell.css?v=4">
  <link rel="stylesheet" href="scene-camera.css?v=4">
  <link rel="stylesheet" href="work-sprites.css?v=4">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="山河家业首页"><span class="seal">山</span><span><strong>山河家业</strong><small>青岚经营记</small></span></a>
    <div class="header-right"><span class="beta">山村测试版</span><button class="icon-button" id="settings-button" aria-label="打开存档与设置">⋯</button></div>
  </header>
  <main class="game-layout" id="game">
    <section class="world-column" aria-label="动态地点画面">
      <div class="scene" id="scene">
        <img class="scene-background" id="scene-image" alt="青岚村的山水生活" src="assets/home-v2.jpg" fetchpriority="high">
        <div class="scene-wash" aria-hidden="true"></div>
        <div class="scene-water" aria-hidden="true"></div>
        <canvas id="scene-motion" aria-hidden="true"></canvas>
        <div class="scene-heading"><span class="eyebrow" id="scene-region">青岚山下</span><h1 id="scene-title">家中小院</h1><span class="scene-weather" id="scene-weather">春日 · 晴</span></div>
        <div class="npc-layer" id="npc-layer"></div>
        <span class="scene-tip">点人物交谈 · 拖动画面 · 双指缩放</span>
        <span class="motion-label" aria-label="动态场景"><i></i>山间日常</span>
      </div>
      <nav class="location-nav" id="locations" aria-label="前往不同地点"></nav>
      <div class="scene-story"><span class="chapter-mark">壹</span><div><h2 id="story-title">从一餐一饭，慢慢置下家业</h2><p id="story-description">一方山水，几位熟人。先学门手艺，再盘算自己的营生。</p></div></div>
      <section class="recent-section" aria-label="最近发生的事"><div class="section-label"><span>村中手记</span><span class="subtle">每一次劳作，都有回响</span></div><ol id="recent-events" class="recent-events"></ol></section>
    </section>
    <section id="management-panel" class="management-column" aria-label="经营与生活">
      <div class="date-line"><span id="date">元年 · 春 · 初一</span><span id="time">辰时</span><span class="autosave" id="save-status"><i></i>进度自动保存</span></div>
      <div class="status-strip" id="status-strip"></div>
      <div class="panel-heading"><span>家业手札</span><button id="close-panel" aria-label="收起手札">×</button></div>
      <nav class="view-tabs" id="view-tabs" aria-label="经营栏目"><button data-view="business" aria-selected="true">营生</button><button data-view="bag" aria-selected="false">行囊</button><button data-view="skills" aria-selected="false">手艺</button><button data-view="ledger" aria-selected="false">账簿</button></nav>
      <div class="view-content" id="view-content" aria-live="polite"></div>
      <p class="version-note">经营测试版 · 本机独立存档 · 无需注册</p>
    </section>
  </main>
  <nav class="game-tools" aria-label="游戏手札"><button id="world-map-button" aria-label="打开世界地图"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7l8-3 10 3 8-3v22l-8 3-10-3-8 3zM11 4v22M21 7v22"/></svg><span>舆图</span></button><button data-open-view="business">营生</button><button data-open-view="bag">行囊</button><button data-open-view="skills">手艺</button><button data-open-view="ledger">账簿</button></nav>
  <button id="panel-scrim" class="panel-scrim" aria-label="收起手札" hidden></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="conversation" id="conversation" aria-labelledby="dialog-name">
    <button class="dialog-close" id="close-conversation" aria-label="结束对话">×</button>
    <div class="person-intro"><div class="portrait-wrap"><img id="dialog-portrait" alt=""></div><div><span class="eyebrow" id="dialog-role"></span><h2 id="dialog-name"></h2><p class="dialog-location" id="dialog-location"></p></div></div>
    <p class="dialog-speech" id="dialog-speech"></p>
    <p class="dialog-result" id="dialog-result" role="status" hidden></p>
    <div id="dialog-actions" class="action-list"></div>
    <button class="text-button leave-dialog" id="leave-conversation">改日再聊</button>
  </dialog>
  <dialog class="settings-dialog" id="settings" aria-labelledby="settings-title">
    <button class="dialog-close" id="close-settings" aria-label="关闭存档与设置">×</button>
    <span class="eyebrow">山河手札</span><h2 id="settings-title">存档与设置</h2>
    <p class="muted">进度保存在当前浏览器。更换手机、清理浏览器前，请导出一份存档。</p>
    <div class="settings-actions"><button class="primary-button" id="export-save">导出存档</button><label class="secondary-button file-label">导入存档<input type="file" id="import-save" accept="application/json,.json"></label><button class="secondary-button" id="toggle-motion">减少画面动态</button></div>
    <p class="setting-message" id="setting-message" role="status"></p>
    <div class="settings-divider"></div><p class="muted small">本版开放务农、养鱼、面摊三条起家路线。家族继承等后续内容暂未开放。</p>
    <button class="danger-button" id="new-game">重新开始一段生活</button>
  </dialog>
  <noscript><p class="noscript">请启用浏览器 JavaScript，才能开始经营与保存进度。</p></noscript>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
